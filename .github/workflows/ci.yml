name: Validate static restoration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The source-backed root and project-subpath builds walk the complete
    # recovered forum corpus; keep enough time for both build/check pairs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Test root deployment
        run: |
          python -m restore build
          python -m restore check
      - name: Test project-subpath deployment
        run: |
          python -m restore build --base-path /bluescholars
          python -m restore check --base-path /bluescholars
      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-source-preview
          path: _site/
          retention-days: 14
