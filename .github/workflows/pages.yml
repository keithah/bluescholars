name: Publish reviewed restoration
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the reviewed static restoration publicly
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirm_publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build only approved content
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python -m restore build --release --base-path "$BASE_PATH"
          python -m restore check --base-path "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    if: inputs.confirm_publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
