name: Recover Internet Archive sources
on:
  workflow_dispatch:
    inputs:
      max_files:
        description: Maximum resource URLs to attempt this run
        default: '150'
        required: true
        type: string
      max_index_pages:
        description: Maximum CDX batches (500 capture records each)
        default: '20'
        required: true
        type: string
      resume_run:
        description: Optional prior recovery run ID to resume
        default: ''
        required: false
        type: string
      commoncrawl_records:
        description: Maximum successful Common Crawl WARC records to preserve (0 disables Common Crawl)
        default: '0'
        required: true
        type: string
      edition_era:
        description: Preserve each URL's latest archived response within this historical edition
        default: 'none'
        required: true
        type: choice
        options: [none, '2007', '2009', '2013']
permissions:
  contents: read
  actions: read
concurrency:
  group: archive-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAX_FILES: ${{ inputs.max_files }}
      MAX_INDEX_PAGES: ${{ inputs.max_index_pages }}
      RESUME_RUN: ${{ inputs.resume_run }}
      COMMONCRAWL_RECORDS: ${{ inputs.commoncrawl_records }}
      EDITION_ERA: ${{ inputs.edition_era }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate bounded inputs
        run: |
          [[ "$MAX_FILES" =~ ^[0-9]+$ && "$MAX_INDEX_PAGES" =~ ^[0-9]+$ ]]
          (( MAX_FILES >= 1 && MAX_FILES <= 2000 && MAX_INDEX_PAGES >= 1 && MAX_INDEX_PAGES <= 200 ))
          [[ -z "$RESUME_RUN" || "$RESUME_RUN" =~ ^[0-9]+$ ]]
          [[ "$COMMONCRAWL_RECORDS" =~ ^[0-9]+$ && "$COMMONCRAWL_RECORDS" -le 3000 ]]
      - name: Restore a prior recovery checkpoint
        if: inputs.resume_run != ''
        run: |
          mkdir -p "$RUNNER_TEMP/archive-recovery"
          gh run download "$RESUME_RUN" --repo "$GH_REPO" --name archive-recovery --dir "$RUNNER_TEMP/archive-recovery"
          python -m restore merge-recovery --artifact "$RUNNER_TEMP/archive-recovery" --run-id "$RESUME_RUN"
      - run: python -m restore seed
      - name: Enumerate domain captures
        id: index
        continue-on-error: true
        run: python -m restore index --max-pages "$MAX_INDEX_PAGES"
      - name: Search source-linked external image URLs
        id: asset-index
        continue-on-error: true
        run: python -m restore index-assets --max-assets 100 --max-pages 3
      - name: Download and discover dependencies
        id: acquire
        continue-on-error: true
        run: python -m restore recover --max-files "$MAX_FILES" --retry-failed
      - name: Search independent Common Crawl collections
        id: commoncrawl
        if: inputs.commoncrawl_records != '0'
        continue-on-error: true
        run: python -m restore commoncrawl --max-records "$COMMONCRAWL_RECORDS" --workers 4
      - name: Search independent Arquivo.pt captures
        id: arquivo
        continue-on-error: true
        run: python -m restore arquivo-domain --max-records 500 --delay 0.5
      - name: Preserve an edition's latest per-URL captures
        id: edition
        if: inputs.edition_era != 'none'
        continue-on-error: true
        run: python -m restore capture-era --era "$EDITION_ERA" --max-files 2000
      - name: Refresh recovery summary
        if: always()
        run: python -m restore status > recovery/report.json
      - name: Build a candidate for inspection (never publishes)
        if: always()
        run: |
          python -m restore build --candidate > recovery/candidate-build-report.json
          python -m restore check --candidate > recovery/candidate-check-report.json
      - name: Preserve source bytes, checkpoint and candidate even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-recovery
          path: |
            recovery/state.json
            recovery/report.json
            recovery/commoncrawl-report.json
            recovery/commoncrawl-*-report.json
            recovery/arquivo-report.json
            recovery/arquivo-state.json
            recovery/arquivo-domain-report.json
            recovery/arquivo-domain-state.json
            recovery/era-*-report.json
            recovery/asset-index-report.json
            recovery/candidate-build-report.json
            recovery/candidate-check-report.json
            recovery/raw/
            recovery/index/
            _candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Report acquisition failure
        if: steps.acquire.outcome == 'failure'
        run: |
          echo 'No successful new acquisition was established. Inspect the saved error report.'
          exit 1
