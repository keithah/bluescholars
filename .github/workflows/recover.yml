name: Recover Internet Archive sources
on:
  workflow_dispatch:
    inputs:
      max_files:
        description: Maximum resource URLs to attempt this run
        default: '150'
        required: true
        type: string
      max_index_pages:
        description: Maximum CDX batches (500 capture records each)
        default: '20'
        required: true
        type: string
      legacy_blog_host:
        description: Confirmed historical blog host to index in addition to bluescholars.com
        default: '02cd02a.netsolhost.com'
        required: false
        type: string
      resume_run:
        description: Optional prior recovery run ID to resume
        default: ''
        required: false
        type: string
      resume_runs:
        description: Comma-separated recovery run IDs to merge into one checkpoint
        default: ''
        required: false
        type: string
      commoncrawl_records:
        description: Maximum successful Common Crawl WARC records to preserve (0 disables Common Crawl)
        default: '0'
        required: true
        type: string
      edition_era:
        description: Preserve each URL's latest archived response within this historical edition
        default: 'none'
        required: true
        type: choice
        options: [none, '2007', '2009', '2013']
permissions:
  contents: read
  actions: read
concurrency:
  group: archive-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAX_FILES: ${{ inputs.max_files }}
      MAX_INDEX_PAGES: ${{ inputs.max_index_pages }}
      LEGACY_BLOG_HOST: ${{ inputs.legacy_blog_host }}
      RESUME_RUN: ${{ inputs.resume_run }}
      RESUME_RUNS: ${{ inputs.resume_runs }}
      COMMONCRAWL_RECORDS: ${{ inputs.commoncrawl_records }}
      EDITION_ERA: ${{ inputs.edition_era }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate bounded inputs
        run: |
          [[ "$MAX_FILES" =~ ^[0-9]+$ && "$MAX_INDEX_PAGES" =~ ^[0-9]+$ ]]
          (( MAX_FILES >= 1 && MAX_FILES <= 2000 && MAX_INDEX_PAGES >= 1 && MAX_INDEX_PAGES <= 200 ))
          [[ -z "$LEGACY_BLOG_HOST" || "$LEGACY_BLOG_HOST" =~ ^[A-Za-z0-9.-]{1,253}$ ]]
          [[ -z "$RESUME_RUN" || "$RESUME_RUN" =~ ^[0-9]+$ ]]
          [[ -z "$RESUME_RUNS" || "$RESUME_RUNS" =~ ^[0-9]+(,[0-9]+)*$ ]]
          [[ -z "$RESUME_RUN" || -z "$RESUME_RUNS" ]]
          [[ "$COMMONCRAWL_RECORDS" =~ ^[0-9]+$ && "$COMMONCRAWL_RECORDS" -le 3000 ]]
      - name: Restore a prior recovery checkpoint
        if: inputs.resume_run != '' || inputs.resume_runs != ''
        run: |
          RUN_IDS="${RESUME_RUNS:-$RESUME_RUN}"
          IFS=',' read -r -a recovery_runs <<< "$RUN_IDS"
          for run_id in "${recovery_runs[@]}"; do
            recovery_dir="$RUNNER_TEMP/archive-recovery/$run_id"
            mkdir -p "$recovery_dir"
            final_dir="$recovery_dir/final"
            indexed_dir="$recovery_dir/indexed"
            if gh run download "$run_id" --repo "$GH_REPO" --name archive-recovery --dir "$final_dir"; then
              artifact_dir="$final_dir"
            else
              gh run download "$run_id" --repo "$GH_REPO" --name archive-recovery-indexed --dir "$indexed_dir"
              artifact_dir="$indexed_dir"
            fi
            python -m restore merge-recovery --artifact "$artifact_dir" --run-id "$run_id"
          done
      - run: python -m restore seed
      - name: Enumerate domain captures
        id: index
        continue-on-error: true
        run: python -m restore index --max-pages "$MAX_INDEX_PAGES"
      - name: Index the confirmed legacy WordPress host
        if: env.LEGACY_BLOG_HOST != ''
        continue-on-error: true
        run: python -m restore index --url "$LEGACY_BLOG_HOST" --match domain --max-pages "$MAX_INDEX_PAGES"
      - name: Search source-linked external image URLs
        id: asset-index
        continue-on-error: true
        run: python -m restore index-assets --max-assets 100 --max-pages 3
      - name: Refresh indexed recovery summary
        if: always()
        run: python -m restore status > recovery/report.json
      - name: Preserve archive index before acquisition
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-recovery-indexed
          path: |
            recovery/state.json
            recovery/report.json
            recovery/asset-index-report.json
            recovery/index/
            recovery/raw/
          retention-days: 30
          if-no-files-found: error
      - name: Download and discover dependencies
        id: acquire
        continue-on-error: true
        run: python -m restore recover --max-files "$MAX_FILES" --retry-failed
      - name: Search independent Common Crawl collections
        id: commoncrawl
        if: inputs.commoncrawl_records != '0'
        continue-on-error: true
        run: python -m restore commoncrawl --max-records "$COMMONCRAWL_RECORDS" --workers 4
      - name: Search independent Arquivo.pt captures
        id: arquivo
        continue-on-error: true
        run: python -m restore arquivo-domain --max-records 500 --delay 0.5
      - name: Preserve an edition's latest per-URL captures
        id: edition
        if: inputs.edition_era != 'none'
        continue-on-error: true
        run: python -m restore capture-era --era "$EDITION_ERA" --max-files 2000
      - name: Refresh recovery summary
        if: always()
        run: python -m restore status > recovery/report.json
      - name: Preserve recovery checkpoint and source bytes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-recovery
          path: |
            recovery/state.json
            recovery/report.json
            recovery/commoncrawl-report.json
            recovery/commoncrawl-*-report.json
            recovery/arquivo-report.json
            recovery/arquivo-state.json
            recovery/arquivo-domain-report.json
            recovery/arquivo-domain-state.json
            recovery/era-*-report.json
            recovery/asset-index-report.json
            recovery/index/
            recovery/raw/
          retention-days: 30
          if-no-files-found: error
      - name: Build a candidate for inspection (never publishes)
        if: always()
        run: |
          python -m restore build --candidate > recovery/candidate-build-report.json
          python -m restore check --candidate > recovery/candidate-check-report.json
      - name: Preserve candidate for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-recovery-candidate
          path: |
            recovery/candidate-build-report.json
            recovery/candidate-check-report.json
            _candidate/
          retention-days: 30
          if-no-files-found: ignore
      - name: Report acquisition failure
        if: steps.acquire.outcome == 'failure'
        run: |
          echo 'No successful new acquisition was established. Inspect the saved error report.'
          exit 1
